name: Deploy to GitHub Pages

on:
  # هر بار که روی برنچ main پوش کردید، اجرا شود
  push:
    branches: [ main ]
  # امکان اجرای دستی
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      
      - name: Install, build, and upload your site
        uses: withastro/action@v2
        # اگر از پکیج منیجر دیگری غیر از npm استفاده می‌کنید اینجا مشخص کنید
        # width:
        #   package-manager: pnpm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4